<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
   <link rel ="stylesheet" href="style.css">
</head>
<body>
  <div class="body">
    <h1>🌦Weather App</h1>
    <div class="search">
      <input type="search" id="searchbar" placeholder="Enter your city" required>
      <button id="search-btn">Search</button>
    </div>
    <button id="locationBtn">Use my location📍</button>
      <div id="errorMessage"></div>
       <div class="current-condition">  
        <h3 id="city">Mumbai</h3>  
        <h3 id="icon">🌦</h3> 
        <h4 id="temperature">temperature</h4>  
        <p id="weather"> Rainy </p> 
        <div id="date-time">31/08/2026</div>
       </div>
      <div class="details">
        <div id="humidity">Humidity</div>
        <div id="wind">Low</div>
        <div id="precipitation">Rain</div>
        <div id="feel">Feels like</div>
      </div>
      <div class="forecast">
           <h3 id="day"> day</h3>  
           <p id="forecastIcon">🌦</p>  
           <h4 id="temp">34°</h4>  
           <p id="condition">condition</p> 
      </div>
       <div class="history">  </div>
        <div class="switch">
          <button id="celsius">Celsius</button>
          <button id="fahrenheit">Fahrenheit</button>
        </div>
     </div>
<script src="script.js"> </script>
</body>
</html>
